name: Repo-Insight PR Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - develop

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  analyze-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better analysis
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Start FalkorDB
        run: |
          docker run -d \
            --name falkordb \
            -p 6379:6379 \
            -e FALKORDB_ARGS="--protected-mode no" \
            falkordb/falkordb:latest
          
          # Wait for FalkorDB to be ready
          timeout 30 bash -c 'until docker exec falkordb redis-cli ping; do sleep 1; done'
      
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v41
        with:
          files: |
            **/*.py
            **/*.js
            **/*.jsx
            **/*.ts
            **/*.tsx
      
      - name: Analyze PR impact
        id: analyze
        env:
          FALKORDB_HOST: localhost
          FALKORDB_PORT: 6379
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python .github/scripts/analyze_pr.py \
            --pr-number ${{ github.event.pull_request.number }} \
            --changed-files "${{ steps.changed-files.outputs.all_changed_files }}" \
            --base-ref ${{ github.event.pull_request.base.sha }} \
            --head-ref ${{ github.event.pull_request.head.sha }} \
            --output pr_analysis.json
      
      - name: Generate PR comment
        id: comment
        run: |
          python .github/scripts/generate_pr_comment.py \
            --analysis pr_analysis.json \
            --output pr_comment.md
      
      - name: Post PR comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const comment = fs.readFileSync('pr_comment.md', 'utf8');
            
            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('🔍 Repo-Insight Analysis')
            );
            
            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }
      
      - name: Upload analysis artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-analysis-${{ github.event.pull_request.number }}
          path: |
            pr_analysis.json
            pr_comment.md
            .cost_tracking.json
          retention-days: 30
      
      - name: Check for breaking changes
        id: breaking-changes
        run: |
          python .github/scripts/check_breaking_changes.py \
            --analysis pr_analysis.json \
            --threshold 10
      
      - name: Fail on critical issues
        if: steps.breaking-changes.outputs.has_critical == 'true'
        run: |
          echo "::error::Critical breaking changes detected!"
          echo "::error::Affected functions: ${{ steps.breaking-changes.outputs.affected_count }}"
          exit 1
      
      - name: Cleanup
        if: always()
        run: |
          docker stop falkordb || true
          docker rm falkordb || true

